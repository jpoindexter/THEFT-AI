<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>THEFT AI — Prototype</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&family=Inter+Tight:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Press+Start+2P&family=Geist:wght@100;200;300;400;500;600;700;800;900&family=Geist+Mono:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ==========================================================================
     COMMON BASE — theme-agnostic resets, utilities, animations, structural layout
     ========================================================================== */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  input, textarea { font-family: inherit; color: inherit; }

  .row { display: flex; align-items: center; gap: 8px; }
  .col { display: flex; flex-direction: column; }
  .grow { flex: 1; min-width: 0; }
  .hidden { display: none !important; }

  #app { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--line);
    background: var(--canvas);
    position: sticky; top: 0; z-index: 30;
  }

  .shell { display: grid; flex: 1; min-height: 0; }
  .shell.full { grid-template-columns: 1fr; }

  .card { background: var(--paper); border: 1px solid var(--line); }

  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--cream-2); color: var(--ink-muted);
    border: 1px solid var(--line); white-space: nowrap;
  }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--paper); color: var(--ink); border: 1px solid var(--line);
    transition: background 120ms ease, border-color 120ms ease;
  }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-muted); }
  .btn.ghost:hover { background: var(--cream); color: var(--ink); }

  .roadmap-connectors { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .roadmap-connectors path { fill: none; transition: stroke 200ms, stroke-width 200ms, opacity 200ms; }
  .roadmap-connectors path.dim { opacity: 0.25; }

  .anim-spin { animation: spin 1.2s linear infinite; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .anim-pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .fade-in { animation: fadeIn 180ms ease-out both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
  .slide-in-right { animation: slideInRight 220ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes slideInRight { from { transform: translateX(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ==========================================================================
     THEME V1 — Warm Paper (Inter + Instrument Serif + JetBrains Mono)
     ========================================================================== */
  body[data-theme="v1"] {
    --canvas: oklch(0.985 0.005 90);
    --paper: oklch(1 0 0);
    --cream: oklch(0.965 0.012 85);
    --cream-2: oklch(0.945 0.014 85);
    --ink: oklch(0.22 0.012 85);
    --ink-muted: oklch(0.45 0.012 85);
    --ink-soft: oklch(0.65 0.012 85);
    --line: oklch(0.92 0.005 85);
    --line-strong: oklch(0.86 0.006 85);
    --mustard: oklch(0.85 0.12 90);
    --mustard-ink: oklch(0.45 0.12 85);
    --mustard-soft: oklch(0.95 0.05 90);
    --sage: oklch(0.82 0.08 145);
    --sage-ink: oklch(0.42 0.08 145);
    --sage-soft: oklch(0.95 0.035 145);
    --brick: oklch(0.62 0.18 25);
    --brick-soft: oklch(0.96 0.04 25);
    --shadow-card: 0 1px 0 oklch(0.92 0.005 85), 0 4px 14px -8px oklch(0.6 0.02 85 / 0.18);
    --shadow-pop: 0 2px 0 oklch(0.92 0.005 85), 0 16px 40px -16px oklch(0.4 0.04 85 / 0.32);
    background: var(--canvas);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    font-size: 13px;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body[data-theme="v1"] .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  body[data-theme="v1"] .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  body[data-theme="v1"] .micro { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
  body[data-theme="v1"] .topbar { height: 48px; padding: 0 16px; gap: 12px; }
  body[data-theme="v1"] .wordmark { font-family: 'Instrument Serif', serif; font-size: 22px; letter-spacing: -0.02em; }
  body[data-theme="v1"] .wordmark .ampersand { font-style: italic; color: var(--ink-muted); }
  body[data-theme="v1"] .shell { grid-template-columns: 220px 1fr 360px; }
  body[data-theme="v1"] .shell.no-chat { grid-template-columns: 220px 1fr; }
  body[data-theme="v1"] .card { border-radius: 10px; }
  body[data-theme="v1"] .pill {
    height: 20px; padding: 0 8px; border-radius: 999px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
  }
  body[data-theme="v1"] .pill.mustard { background: var(--mustard-soft); color: var(--mustard-ink); border-color: oklch(0.88 0.08 90); }
  body[data-theme="v1"] .pill.sage    { background: var(--sage-soft); color: var(--sage-ink); border-color: oklch(0.88 0.06 145); }
  body[data-theme="v1"] .pill.brick   { background: var(--brick-soft); color: var(--brick); border-color: oklch(0.88 0.08 25); }
  body[data-theme="v1"] .pill.ghost   { background: transparent; }
  body[data-theme="v1"] .btn { height: 32px; padding: 0 14px; border-radius: 8px; font-weight: 500; font-size: 13px; }
  body[data-theme="v1"] .btn:hover { background: var(--cream); }
  body[data-theme="v1"] .btn.primary { background: var(--mustard); border-color: oklch(0.78 0.13 90); color: oklch(0.25 0.05 85); }
  body[data-theme="v1"] .btn.primary:hover { background: oklch(0.82 0.13 90); }
  body[data-theme="v1"] .btn.danger { color: var(--brick); border-color: oklch(0.85 0.08 25); }
  body[data-theme="v1"] .btn.lg { height: 40px; padding: 0 16px; font-size: 14px; border-radius: 9px; }
  body[data-theme="v1"] .btn.sm { height: 26px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
  body[data-theme="v1"] .placeholder-bg {
    background:
      repeating-linear-gradient(135deg, oklch(0.95 0.008 85) 0 6px, transparent 6px 12px),
      var(--cream);
  }
  body[data-theme="v1"] .roadmap-connectors path { stroke: oklch(0.85 0.07 90); stroke-width: 1.25; stroke-dasharray: 3 3; }
  body[data-theme="v1"] .roadmap-connectors path.hi { stroke: var(--mustard); stroke-width: 1.8; stroke-dasharray: none; opacity: 1; }
  body[data-theme="v1"] ::-webkit-scrollbar-thumb { background: oklch(0.88 0.006 85); border-radius: 5px; border: 2px solid var(--canvas); }
  body[data-theme="v1"] ::-webkit-scrollbar-thumb:hover { background: oklch(0.78 0.008 85); }

  /* ==========================================================================
     THEME V2 — Factory Orange (Geist + Geist Mono + code orange accent)
     ========================================================================== */
  body[data-theme="v2"] {
    --color-factory-black: #020202;
    --color-factory-light-gray: #eeeeee;
    --color-faded-silver: #fafafa;
    --color-cool-gray: #b8b3b0;
    --color-graphite: #3d3a39;
    --color-ash-gray: #a49d9a;
    /* Accent: deep violet — bold single-hue against Factory cool grays (t72t direction).
       Variable name preserved so existing rules still apply — just the hue swaps. */
    --color-code-orange: #7c3aed;
    --canvas: #eeeeee;
    --paper: #fafafa;
    --cream: #eeeeee;
    --cream-2: #e4e0dd;
    --ink: #020202;
    --ink-muted: #3d3a39;
    --ink-soft: #a49d9a;
    --line: #b8b3b0;
    --line-strong: #a49d9a;
    --mustard: #7c3aed;
    --mustard-ink: #7c3aed;
    --mustard-soft: #fafafa;
    --sage: #020202;
    --sage-ink: #020202;
    --sage-soft: #fafafa;
    --brick: #020202;
    --brick-soft: #eeeeee;
    --shadow-card: none;
    --shadow-pop: none;
    background: var(--canvas);
    font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    font-size: 14px;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* Display headlines — Factory signature: Geist 500 with very tight (-0.07em) tracking */
  body[data-theme="v2"] .serif { font-family: 'Geist', ui-sans-serif, sans-serif; font-weight: 500; letter-spacing: -0.07em; }
  /* Display sizes from Factory token scale: heading-lg 48/-2.3px, display 60/-2.88px, heading 24 */
  body[data-theme="v2"] .serif[style*="font-size: 30"] { font-size: 48px !important; line-height: 1.05 !important; letter-spacing: -0.048em !important; }
  body[data-theme="v2"] .serif[style*="font-size: 22"] { font-size: 24px !important; line-height: 1.2 !important; letter-spacing: -0.03em !important; }
  body[data-theme="v2"] .serif[style*="font-size: 44"] { font-size: 60px !important; line-height: 1 !important; letter-spacing: -0.048em !important; }
  /* Italic phrase inside display headline — stay in the Geist system (no serif mix).
     Use weight + accent color for emphasis; strip the faux-italic (looks ragged at display sizes). */
  body[data-theme="v2"] .serif span[style*="italic"] {
    font-style: normal !important;
    font-weight: 400 !important;
    color: var(--color-code-orange) !important;
    letter-spacing: -0.04em;
  }
  body[data-theme="v2"] .serif em, body[data-theme="v2"] .serif i { font-style: normal; color: var(--color-code-orange); font-weight: 500; }
  body[data-theme="v2"] .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -0.02em; }
  body[data-theme="v2"] .micro { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: uppercase; color: var(--ink-muted); }
  body[data-theme="v2"] .topbar { height: 52px; padding: 0 20px; gap: 16px; border-radius: 0; }
  body[data-theme="v2"] .wordmark { font-family: 'Geist Mono', monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink); }
  body[data-theme="v2"] .wordmark .ampersand { font-style: normal; color: var(--color-code-orange); margin-left: 1px; }
  body[data-theme="v2"] .shell { grid-template-columns: 232px 1fr 380px; }
  body[data-theme="v2"] .shell.no-chat { grid-template-columns: 232px 1fr; }
  body[data-theme="v2"] .card { border-radius: 6px; }
  body[data-theme="v2"] .pill {
    height: 22px; padding: 0 8px; border-radius: 4px;
    font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 400; letter-spacing: -0.01em;
    background: transparent; color: var(--ink-muted); text-transform: uppercase;
  }
  body[data-theme="v2"] .pill.mustard { background: transparent; color: var(--color-code-orange); border-color: var(--color-code-orange); }
  body[data-theme="v2"] .pill.sage    { background: transparent; color: var(--ink); border-color: var(--ink); }
  body[data-theme="v2"] .pill.brick   { background: transparent; color: var(--ink); border-color: var(--ink); }
  body[data-theme="v2"] .pill.ghost   { background: transparent; border-color: transparent; }
  body[data-theme="v2"] .btn {
    height: 32px; padding: 0 12px; border-radius: 4px;
    font-family: 'Geist', sans-serif; font-weight: 400; font-size: 14px; letter-spacing: -0.01em;
    background: var(--color-faded-silver); color: var(--ink); border: 1px solid var(--color-ash-gray);
  }
  body[data-theme="v2"] .btn:hover { background: var(--cream-2); }
  body[data-theme="v2"] .btn.primary { background: var(--ink); color: var(--color-factory-light-gray); border-color: var(--ink); }
  body[data-theme="v2"] .btn.primary:hover { background: var(--color-graphite); border-color: var(--color-graphite); }
  body[data-theme="v2"] .btn.danger { color: var(--ink); border-color: var(--ink); }
  body[data-theme="v2"] .btn.lg { height: 40px; padding: 0 16px; font-size: 16px; border-radius: 4px; }
  body[data-theme="v2"] .btn.sm { height: 26px; padding: 0 10px; font-size: 13px; border-radius: 4px; }
  body[data-theme="v2"] .placeholder-bg {
    background-image: radial-gradient(var(--color-cool-gray) 1px, transparent 1px);
    background-size: 8px 8px; background-color: var(--color-faded-silver);
  }
  body[data-theme="v2"] .roadmap-connectors path { stroke: var(--color-cool-gray); stroke-width: 1; stroke-dasharray: 2 4; }
  body[data-theme="v2"] .roadmap-connectors path.hi { stroke: var(--color-code-orange); stroke-width: 1.5; stroke-dasharray: none; opacity: 1; }
  body[data-theme="v2"] [style*="var(--mustard)"][style*="border-radius: 50%"] { color: var(--color-factory-light-gray) !important; }
  body[data-theme="v2"] ::-webkit-scrollbar-thumb { background: var(--color-cool-gray); border-radius: 0; border: 2px solid var(--canvas); }
  body[data-theme="v2"] ::-webkit-scrollbar-thumb:hover { background: var(--color-ash-gray); }

  /* ==========================================================================
     THEME V3 — t72t.com "Mono-Forward Technical Specimen"
     JetBrains Mono everywhere. Warm off-white canvas. Signal-orange #ff3d00 accent.
     Black 1px hairlines. Square edges (2px radius). All-caps headings.
     Repeating-marquee wordmark prefix. Diagonal-hatched placeholders.
     ========================================================================== */
  body[data-theme="v3"] {
    --canvas: #e9e4db;
    --paper: #f3efe6;
    --cream: #e9e4db;
    --cream-2: #ddd6c8;
    --ink: #050505;
    --ink-muted: #2a2a2a;
    --ink-soft: #7c766a;
    --line: #050505;
    --line-strong: #050505;
    --accent: #ff3d00;
    --mustard: #ff3d00;
    --mustard-ink: #ff3d00;
    --mustard-soft: #f3efe6;
    --sage: #050505;
    --sage-ink: #050505;
    --sage-soft: #f3efe6;
    --brick: #ff3d00;
    --brick-soft: #f3efe6;
    --shadow-card: none;
    --shadow-pop: none;
    background: var(--canvas);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
    color: var(--ink);
    font-size: 12px;
    line-height: 1.45;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* Display class — large mono caps */
  body[data-theme="v3"] .serif {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: -0.03em;
  }
  body[data-theme="v3"] .serif em, body[data-theme="v3"] .serif i { font-style: normal; color: var(--accent); }
  body[data-theme="v3"] .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: 0; }
  body[data-theme="v3"] .micro {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; font-weight: 500; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--ink-muted);
  }
  body[data-theme="v3"] .topbar { height: 56px; padding: 0 20px; gap: 16px; border-bottom: 1px solid var(--ink); }
  body[data-theme="v3"] .wordmark {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--ink);
    display: inline-flex; align-items: center; gap: 8px;
  }
  /* Repeating-marquee prefix — renders as "THEFT_AI / THEFT_AI / THEFT &" */
  body[data-theme="v3"] .wordmark::before {
    content: 'THEFT_AI / THEFT_AI / ';
    color: var(--ink-soft);
    font-weight: 400;
  }
  body[data-theme="v3"] .wordmark .ampersand { color: var(--accent); margin-left: 2px; font-style: normal; }
  body[data-theme="v3"] .shell { grid-template-columns: 232px 1fr 380px; }
  body[data-theme="v3"] .shell.no-chat { grid-template-columns: 232px 1fr; }
  body[data-theme="v3"] .card { border-radius: 2px; border: 1px solid var(--ink); }
  body[data-theme="v3"] .pill {
    height: 20px; padding: 0 7px; border-radius: 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 500; letter-spacing: 0.05em;
    background: transparent; color: var(--ink); border: 1px solid var(--ink);
    text-transform: uppercase;
  }
  body[data-theme="v3"] .pill.mustard { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  body[data-theme="v3"] .pill.sage    { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  body[data-theme="v3"] .pill.brick   { background: transparent; color: var(--accent); border-color: var(--accent); }
  body[data-theme="v3"] .pill.ghost   { background: transparent; border-color: transparent; }
  body[data-theme="v3"] .btn {
    height: 30px; padding: 0 12px; border-radius: 2px;
    font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 12px;
    letter-spacing: 0.02em; text-transform: uppercase;
    background: transparent; color: var(--ink); border: 1px solid var(--ink);
    transition: background 100ms ease, color 100ms ease;
  }
  body[data-theme="v3"] .btn:hover { background: var(--ink); color: var(--paper); }
  body[data-theme="v3"] .btn.primary { background: var(--accent); color: var(--paper); border-color: var(--accent); }
  body[data-theme="v3"] .btn.primary:hover { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  body[data-theme="v3"] .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-muted); text-transform: uppercase; }
  body[data-theme="v3"] .btn.ghost:hover { background: transparent; color: var(--ink); }
  body[data-theme="v3"] .btn.danger { color: var(--accent); border-color: var(--accent); }
  body[data-theme="v3"] .btn.lg { height: 40px; padding: 0 16px; font-size: 13px; }
  body[data-theme="v3"] .btn.sm { height: 24px; padding: 0 9px; font-size: 11px; }
  /* Placeholder — diagonal hatched (t72t signature) */
  body[data-theme="v3"] .placeholder-bg {
    background-image: repeating-linear-gradient(
      45deg, transparent 0, transparent 6px,
      rgba(0,0,0,0.12) 6px, rgba(0,0,0,0.12) 7px
    );
    background-color: var(--cream-2);
  }
  body[data-theme="v3"] .roadmap-connectors path { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.45; }
  body[data-theme="v3"] .roadmap-connectors path.dim { opacity: 0.12; }
  body[data-theme="v3"] .roadmap-connectors path.hi { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: none; opacity: 1; }
  /* Avatar dots use --mustard background — text should read on orange */
  body[data-theme="v3"] [style*="var(--mustard)"][style*="border-radius: 50%"] { color: var(--paper) !important; }
  /* Force all h1-h4 to mono caps (in case any view uses them directly) */
  body[data-theme="v3"] h1, body[data-theme="v3"] h2, body[data-theme="v3"] h3, body[data-theme="v3"] h4 {
    font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: -0.02em;
  }
  /* Inputs/textareas — square, mono */
  body[data-theme="v3"] textarea, body[data-theme="v3"] input[type="text"] {
    border-radius: 2px !important; font-family: 'JetBrains Mono', monospace !important;
  }
  /* Approval-card left accent bar (JSX uses width: 4) — switch sage/mustard fills to signal orange */
  body[data-theme="v3"] div[style*="background: var(--sage)"][style*="width: 4"],
  body[data-theme="v3"] div[style*="background: var(--mustard)"][style*="width: 4"] { background: var(--accent) !important; }
  /* Sub-step "complete" check uses hardcoded green oklch — override to paper-on-black */
  body[data-theme="v3"] [style*="oklch(0.3 0.04 145)"] { color: var(--paper) !important; }
  body[data-theme="v3"] ::-webkit-scrollbar { width: 8px; height: 8px; }
  body[data-theme="v3"] ::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 0; border: 2px solid var(--canvas); }

  /* ==========================================================================
     THEME V4 — "Technical Editorial" (V2 × V3 hybrid)
     Body/display: Geist (V2's readable modern type).
     Labels/pills/buttons/wordmark: JetBrains Mono uppercase (V3's technical character).
     Accent: Factory code orange #ef6f2e (V2's refined hue, not V3's neon).
     Canvas: warm light gray (between V2 silver and V3 cream).
     Radii: 4px (between V2 6px and V3 2px).
     Wordmark: marquee prefix from V3. Placeholders: hatched from V3.
     ========================================================================== */
  body[data-theme="v4"] {
    --canvas: #f0ece6;
    --paper: #fafafa;
    --cream: #f0ece6;
    --cream-2: #e8e2d8;
    --ink: #0a0a0a;
    --ink-muted: #3d3a39;
    --ink-soft: #8a8380;
    --line: #c9c4be;
    --line-strong: #0a0a0a;
    --accent: #ef6f2e;
    --mustard: #ef6f2e;
    --mustard-ink: #ef6f2e;

const NODE_W = 220;
const NODE_H = 64;
const COL_W = 244;
const COL_GAP = 24;
const ROW_GAP = 12;

const STATUS_LABEL = {
  locked: 'Locked', available: 'Available', in_progress: 'In progress', complete: 'Complete',
};

const NodeCard = ({ node, isHovered, onMouseEnter, onMouseLeave, onClick, dim }) => {

  const isLocked = node.status === 'locked';
  const isComplete = node.status === 'complete';
  const isProgress = node.status === 'in_progress';
  const isAvail = node.status === 'available';

        transition: 'opacity 200ms, border-color 200ms, transform 120ms, box-shadow 120ms',
        boxShadow: isHovered ? 'var(--shadow-pop)' : 'var(--shadow-card)',
        transform: isHovered && !isLocked ? 'translateY(-1px)' : 'none',
        position: 'relative', display: 'flex', flexDirection: 'column', gap: 4 }}>

        {isAvail && <span className="pill mustard" style={{ height: 16, padding: '0 6px', fontSize: 9.5, letterSpacing: '0.05em' }}>AVAILABLE</span>}
        {isLocked && <IconLock size={11} style={{ color: 'var(--ink-soft)' }} />}
        <span className="grow" />
        <span style={{ color: 'var(--ink-soft)', display: 'inline-flex', alignItems: 'center' }}><D size={13} /></span>
      </div>
      <div style={{ fontSize: 13, fontWeight: 600, lineHeight: 1.3, color: 'var(--ink)' }}>{node.title}</div>
      <div style={{ fontSize: 11, color: 'var(--ink-soft)' }}>
        {isLocked ? 'Needs earlier steps' : STATUS_LABEL[node.status]}
      </div>
    </div>
  );
};

function layoutNodes() {
  const cols = STAGES.map(s => NODES.filter(n => n.stage === s.id));
  const pos = {};
  cols.forEach((col, cIdx) => {
    col.forEach((node, rIdx) => {
      pos[node.id] = { x: cIdx * COL_W, y: rIdx * (NODE_H + ROW_GAP) + 40, w: NODE_W, h: NODE_H, col: cIdx, row: rIdx };
    });
  });
  const cols_max = Math.max(...cols.map(c => c.length));
  const height = cols_max * (NODE_H + ROW_GAP) + 60;
  const width = STAGES.length * COL_W;
  return { pos, cols, height, width };
}

function connectorPath(a, b) {
  const x1 = a.x + a.w; const y1 = a.y + a.h / 2;
  const x2 = b.x; const y2 = b.y + b.h / 2;
  const dx = (x2 - x1) / 2;
  return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}

const RoadmapView = ({ onOpenNode }) => {
  const layout = React.useMemo(layoutNodes, []);
  const [hoverId, setHoverId] = React.useState(null);
  const stageStats = STAGES.map(s => {
    const list = NODES.filter(n => n.stage === s.id);
    const done = list.filter(n => n.status === 'complete').length;
    return { ...s, done, total: list.length };
  });
  const edges = [];
  NODES.forEach(n => {
    n.needs.forEach(nid => {
      if (layout.pos[nid] && layout.pos[n.id]) edges.push({ from: nid, to: n.id });
    });
  });
  const hi = new Set();
  if (hoverId) {
    edges.forEach(e => {
      if (e.from === hoverId || e.to === hoverId) hi.add(e.from + '->' + e.to);
    });
  }
  return (
    <div style={{ flex: 1, minHeight: 0, overflow: 'auto', background: 'var(--canvas)' }}>
      <div style={{ padding: '20px 28px 14px', borderBottom: '1px solid var(--line)' }}>
        <div className="row" style={{ marginBottom: 4 }}>
          <div className="col" style={{ gap: 4 }}>
            <div className="micro">Company roadmap</div>
            <div className="serif" style={{ fontSize: 30, lineHeight: 1.1, letterSpacing: '-0.01em' }}>
              Designer Subs <span style={{ color: 'var(--ink-soft)', fontStyle: 'italic' }}>— from idea to mature.</span>
            </div>
          </div>
          <span className="grow" />
          <div className="row" style={{ gap: 6 }}>
            <span className="pill"><IconDot size={6} color="var(--ink-soft)" /> 11 complete</span>
            <span className="pill mustard"><IconDot size={6} color="var(--mustard-ink)" /> 5 in progress</span>
            <span className="pill"><IconDot size={6} color="var(--ink-soft)" /> 8 available</span>
            <button className="btn sm" style={{ marginLeft: 6 }}>
              <IconPlus size={13} /> Add capability
            </button>
          </div>
        </div>
        <div className="row" style={{ marginTop: 10, gap: 14, color: 'var(--ink-muted)', fontSize: 12 }}>
          <span>The tree below is your full build. Hover any card to see what depends on it. Click to launch the agent.</span>
        </div>
      </div>
      <div style={{ padding: '20px 28px 40px', position: 'relative' }}>
        <div style={{ position: 'relative', width: layout.width, height: layout.height, paddingBottom: 8 }}>
          {STAGES.map((s, i) => {
            const stats = stageStats[i];
            return (
              <div key={s.id} style={{ position: 'absolute', top: 0, left: i * COL_W, width: NODE_W,
                display: 'flex', alignItems: 'center', gap: 8, padding: '0 2px 8px' }}>
                <div className="micro" style={{ color: 'var(--ink)' }}>{s.name} stage</div>
                <span className="grow" />
                <span className="mono" style={{ fontSize: 11, color: 'var(--ink-soft)' }}>{stats.done}/{stats.total}</span>
              </div>
            );
          })}
          {STAGES.slice(0, -1).map((s, i) => (
            <div key={s.id} style={{ position: 'absolute', top: 0, bottom: 0,
              left: i * COL_W + NODE_W + COL_GAP / 2 - 1,
              width: 1, background: 'var(--line)', opacity: 0.5 }} />
          ))}
          <svg className="roadmap-connectors" width={layout.width} height={layout.height}
            viewBox={`0 0 ${layout.width} ${layout.height}`}>
            {edges.map(e => {
              const a = layout.pos[e.from]; const b = layout.pos[e.to];
              const isHi = hi.has(e.from + '->' + e.to);
              const isDim = hoverId && !isHi;
              return (
                <path key={e.from + '->' + e.to} d={connectorPath(a, b)}
                  className={isHi ? 'hi' : (isDim ? 'dim' : '')} />
              );
            })}
          </svg>
          {NODES.map(n => {
            const p = layout.pos[n.id];
            return (
              <div key={n.id} style={{ position: 'absolute', left: p.x, top: p.y, zIndex: 1 }}>
                <NodeCard node={n}
                  isHovered={hoverId === n.id}
                  onMouseEnter={() => setHoverId(n.id)}
                  onMouseLeave={() => setHoverId(null)}
                  onClick={() => n.status !== 'locked' && onOpenNode(n.id)}
                  dim={hoverId && hoverId !== n.id && !hi.has(hoverId + '->' + n.id) && !hi.has(n.id + '->' + hoverId)} />
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

);

const LibraryView = () => (
  <div style={{ flex: 1, overflow: 'auto', background: 'var(--canvas)' }}>
    <div style={{ padding: '20px 28px 14px', borderBottom: '1px solid var(--line)' }}>
      <div className="micro">Reference</div>
      <div className="serif" style={{ fontSize: 30, lineHeight: 1.1, letterSpacing: '-0.01em', marginTop: 4 }}>Library</div>
      <div style={{ color: 'var(--ink-muted)', fontSize: 13, marginTop: 6 }}>
        Every artifact every agent has shipped, plus context you've pasted in.
      </div>
    </div>
    <div style={{ padding: 28 }}>
      <EmptyState title="Library viewer is a follow-up screen"
        body="The 6-screen prototype scope ships Library as a stub. Wire the artifact viewer once core flows are validated." />
    </div>
  </div>
);

// ============================================================================
// App + ScreenSwitcher
// ============================================================================
const { useState, useEffect } = React;

function goTarget(target, setView, setDept, setDrawerNode, setChatMode, setSelectedApproval) {
  setDrawerNode(null); setSelectedApproval(null);
  if (target === 'onboarding') { setView('onboarding'); return; }
  if (target === 'roadmap')    { setView('roadmap'); setChatMode('operator'); return; }
  if (target === 'drawer')     { setView('roadmap'); setDrawerNode('id.brand'); setChatMode('operator'); return; }
  if (target === 'chat')       { setView('roadmap'); setChatMode('workspace'); return; }
  if (target === 'department') { setView('department'); setDept('engineering'); setChatMode('department'); return; }
  if (target === 'approvals')  { setView('approvals'); setChatMode('operator'); return; }
}

const THEMES = [
  { id: 'v1', label: 'V1 · Warm Paper',          hint: 'Inter + Instrument Serif. Mustard accent.' },
  { id: 'v2', label: 'V2 · Factory Violet',       hint: 'Geist. Deep-violet accent. Pure system.' },
  { id: 'v3', label: 'V3 · Mono Specimen',       hint: 'JetBrains Mono. Signal-orange accent. (t72t)' },
  { id: 'v4', label: 'V4 · Technical Editorial', hint: 'Geist body + mono labels. V2 × V3 hybrid.' },
  { id: 'v5', label: 'V5 · Chrome',              hint: 'JetBrains Mono. White + black + electric blue.' },
  { id: 'v6', label: 'V6 · Charcoal',            hint: 'DM Sans only. Pale blue + rose. Dark canvas.' },
  { id: 'v7', label: 'V7 · Charcoal Mono',       hint: 'JetBrains Mono. Same palette as V6 — terminal feel.' },
  { id: 'v8', label: 'V8 · Brutalist',            hint: 'Inter Tight 900. Pure monotone — black + off-white only.' },
  { id: 'v9', label: 'V9 · Droid',               hint: 'Press Start 2P + JetBrains Mono. Monotone warm off-white.' },
  { id: 'v10', label: 'V10 · FL-41',              hint: 'Geist. FL-41 rose — dark warm sepia, peach cream text.' },
  { id: 'v11', label: 'V11 · Warm Mono',          hint: 'V2 system × FL-41 palette. Geist. No color — pure value.' },
  { id: 'v12', label: 'V12 · Factory Dark',       hint: 'Geist. Dark canvas + inverted cream cards. Orange-red accent.' },
  { id: 'v13', label: 'V13 · GitHub Dark CB',     hint: 'Exact GitHub Dark Colorblind tokens. #0d1117 · #388bfd.' },
  { id: 'v14', label: 'V14 · Factory Mono',       hint: 'V2 colors. Geist Mono only — no sans mixing.' },
  { id: 'v15', label: 'V15 · Light Mono',          hint: 'V2 structure. Geist Mono only. Light canvas, gray accent.' },
];

const ThemeSwitcher = ({ theme, onChange }) => {
  const [open, setOpen] = useState(false);
  const current = THEMES.find(t => t.id === theme) || THEMES[2];
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 8 }}>
      {open && (
        <div className="fade-in card" style={{ padding: 8, minWidth: 280,
          display: 'flex', flexDirection: 'column', gap: 2 }}>
          <div className="micro" style={{ padding: '4px 8px' }}>Theme</div>
          {THEMES.map(t => (
            <button key={t.id} onClick={() => { onChange(t.id); setOpen(false); }}
              style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start',
                gap: 2, padding: '8px 10px', textAlign: 'left',
                background: t.id === theme ? 'var(--cream-2)' : 'transparent',
                borderRadius: 4 }}>
              <span style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12.5,
                fontWeight: t.id === theme ? 600 : 500 }}>
                <span style={{ width: 6, height: 6, borderRadius: '50%',
                  background: t.id === theme ? 'var(--mustard)' : 'var(--line-strong)' }} />
                {t.label}
              </span>
              <span style={{ fontSize: 11, color: 'var(--ink-soft)', paddingLeft: 14 }}>{t.hint}</span>
            </button>
          ))}
        </div>
      )}
      <button className="btn" onClick={() => setOpen(o => !o)}
        style={{ paddingLeft: 12, paddingRight: 12 }}>
        Theme: {current.id.toUpperCase()} {open ? '▾' : '▴'}
      </button>
    </div>
  );
};

const ScreenSwitcher = ({ view, drawerOpen, chatMode, onGo, theme, onThemeChange }) => {
  const [open, setOpen] = useState(false);
  const screens = [
    { id: 'roadmap',    label: '1 · Roadmap home',         active: view === 'roadmap' && !drawerOpen && chatMode === 'operator' },
    { id: 'drawer',     label: '2 · Node detail (drawer)', active: view === 'roadmap' && drawerOpen },
    { id: 'chat',       label: '3 · Chat workspace',       active: chatMode === 'workspace' },
    { id: 'department', label: '4 · Department drill-in',  active: view === 'department' },
    { id: 'approvals',  label: '5 · Approvals inbox',      active: view === 'approvals' },
    { id: 'onboarding', label: '6 · Onboarding',           active: view === 'onboarding' },
  ];
  return (
    <div style={{ position: 'fixed', bottom: 16, right: 16, zIndex: 50,
      display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 8 }}>
      <ThemeSwitcher theme={theme} onChange={onThemeChange} />
      {open && (
        <div className="fade-in card" style={{ padding: 8, minWidth: 240,
          boxShadow: 'var(--shadow-pop)', display: 'flex', flexDirection: 'column', gap: 2 }}>
          <div className="micro" style={{ padding: '4px 8px' }}>Prototype · jump to screen</div>
          {screens.map(s => (
            <button key={s.id} onClick={() => { onGo(s.id); }} style={{
              display: 'flex', alignItems: 'center', gap: 8, padding: '6px 8px', borderRadius: 6, textAlign: 'left',
              background: s.active ? 'var(--cream-2)' : 'transparent',
              fontWeight: s.active ? 600 : 500, fontSize: 12.5 }}>
              <span style={{ width: 6, height: 6, borderRadius: '50%',
                background: s.active ? 'var(--mustard)' : 'var(--line-strong)' }} />
              {s.label}
            </button>
          ))}
        </div>
      )}
      <button className="btn primary" onClick={() => setOpen(o => !o)}
        style={{ borderRadius: 999, paddingLeft: 14, paddingRight: 14, boxShadow: 'var(--shadow-pop)' }}>
        Screens {open ? '▾' : '▴'}
      </button>
    </div>
  );
};

function App() {
  const [view, setView] = useState('roadmap');
  const [dept, setDept] = useState('engineering');
  const [drawerNode, setDrawerNode] = useState(null);
  const [chatMode, setChatMode] = useState('operator');
  const [selectedApproval, setSelectedApproval] = useState(null);
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem('theft-theme') || 'v3'; } catch { return 'v3'; }
  });

  useEffect(() => {
    document.body.dataset.theme = theme;
    try { localStorage.setItem('theft-theme', theme); } catch {}
  }, [theme]);

  useEffect(() => {
    if (view === 'department') setChatMode('department');
    else if (view !== 'tasks') setChatMode('operator');
  }, [view]);

  const onOpenNode = (id) => setDrawerNode(id);
  const onLaunchAgent = () => { setChatMode('workspace'); setDrawerNode(null); };
  const onApprovalAct = (id, action) => {
    APPROVALS.forEach(a => { if (a.id === id) a.state = action === 'approve' ? 'approved' : 'rejected'; });
    setSelectedApproval(s => s);
    setView(v => v);
  };

  if (view === 'onboarding') {
    return (<>
      <TopBar minimal onLogo={() => setView('roadmap')} />
      <div className="shell full" data-screen-label="06 Onboarding">
        <OnboardingView onContinue={() => setView('roadmap')} />
      </div>
      <ScreenSwitcher view={view} dept={dept} drawerOpen={false} chatMode={chatMode}
        theme={theme} onThemeChange={setTheme}
        onGo={(t) => goTarget(t, setView, setDept, setDrawerNode, setChatMode, setSelectedApproval)} />
    </>);
  }

  let crumb = 'Roadmap';
  if (view === 'tasks') crumb = 'Tasks';
  else if (view === 'approvals') crumb = 'Approvals';
  else if (view === 'library') crumb = 'Library';
  else if (view === 'department') crumb = 'Departments / ' + DEPT_BY_ID[dept].name;

  let center = null;
  if (view === 'roadmap') center = <RoadmapView onOpenNode={onOpenNode} drawerOpen={!!drawerNode} />;
  else if (view === 'department') center = <DepartmentView deptId={dept} onOpenNode={onOpenNode} />;
  else if (view === 'approvals') center = <ApprovalsView selected={selectedApproval} onSelect={setSelectedApproval} onAct={onApprovalAct} />;
  else if (view === 'tasks') center = <TasksView onOpenWorkspace={() => setChatMode('workspace')} />;
  else if (view === 'library') center = <LibraryView />;

  let chat = null;
  if (chatMode === 'workspace')
    chat = <ChatPanelWorkspace onBack={() => setChatMode(view === 'department' ? 'department' : 'operator')} />;
  else if (chatMode === 'department')
    chat = <ChatPanelEmpty deptId={dept} title={DEPT_BY_ID[dept].name + ' Agent'} />;
  else chat = <ChatPanelEmpty title="Operator" />;

  const labels = {
    roadmap: '01 Roadmap', department: '04 Department · ' + DEPT_BY_ID[dept].name,
    approvals: '05 Approvals', tasks: 'Tasks', library: 'Library',
  };

  return (<>
    <TopBar orgName="Designer Subs" breadcrumb={crumb} onLogo={() => setView('roadmap')} />
    <div className="shell" data-screen-label={labels[view] || view}>
      <Sidebar view={view} dept={dept}
        onNav={(v) => { setView(v); setDrawerNode(null); }}
        onDept={(d) => { setView('department'); setDept(d); setDrawerNode(null); }} />
      <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', minWidth: 0, overflow: 'hidden' }}>
        {center}
        {drawerNode && <NodeDrawer nodeId={drawerNode} onClose={() => setDrawerNode(null)} onLaunch={onLaunchAgent} />}
      </div>
      {chat}
    </div>
    <ScreenSwitcher view={view} dept={dept} drawerOpen={!!drawerNode} chatMode={chatMode}
      theme={theme} onThemeChange={setTheme}
      onGo={(t) => goTarget(t, setView, setDept, setDrawerNode, setChatMode, setSelectedApproval)} />
  </>);
}

const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App />);
</script>
</body>
</html>
